[package]
name = "opsgenie-desktop"
version = "0.1.0"
authors = ["Vlad Vasiliu <vladvasiliun@gmail.com>"]
edition = "2024"


[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
fern = "0.7"
log = "0.4"
notify-rust = "4"
opsgenie-rs = { version = "0.1.0-alpha.2" }
tokio = { version = "1", features = ["macros", "parking_lot", "rt-multi-thread", "signal", "time"] }

[profile.release]
lto = true
incremental = true
codegen-units = 1
panic = "abort"

[profile.dev.package.backtrace]
opt-level = 3
